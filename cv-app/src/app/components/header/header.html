<header class="cv-header text-white mb-5">

  <div class="profile text-center mb-4">
    <img src="Diego-Escobedo.jpg"
         class="profile-img img-thumbnail rounded-circle border border-3 border-white shadow-lg mb-3">

    <h1 class="display-5 fw-bold">Diego Escobedo</h1>
    <p class="lead">Estudiante de la Universidad Francisco Marroquín</p>

    <h3 class="fw-light">{{ saludo }}</h3>
  </div>

  <div class="text-center mb-4">
    <button class="btn btn-light btn-lg px-4 shadow-sm"
            (click)="descargarPDF()">
      <i class="bi bi-file-earmark-pdf me-2"></i>Descargar como PDF
    </button>
  </div>

  <button
  class="btn btn-sm mt-3"
  [ngClass]="modoOscuro ? 'btn-light' : 'btn-dark'"
  (click)="toggleTema()">

  <i class="bi"
     [ngClass]="modoOscuro ? 'bi-sun-fill' : 'bi-moon-fill'"></i>

  {{ modoOscuro ? 'Modo Claro' : 'Modo Oscuro' }}

  </button>

  <div class="d-flex justify-content-center mb-2">
    <button class="btn btn-outline-light btn-sm"
            (click)="toggleContacto()">
      <i class="bi"
         [ngClass]="mostrarContacto ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
      {{ mostrarContacto ? 'Ocultar Contacto' : 'Mostrar Contacto' }}
    </button>
  </div>

  <nav class="contact-nav d-flex justify-content-center flex-wrap gap-3"
       *ngIf="mostrarContacto">
    <a href="mailto:diego.escobedo@ufm.edu" class="btn btn-outline-light">
      <i class="bi bi-envelope me-2"></i>Email
    </a>
    <a href="https://github.com/Diego-Escobedo123" target="_blank"
       class="btn btn-outline-light">
      <i class="bi bi-github me-2"></i>GitHub
    </a>
  </nav>

</header>
